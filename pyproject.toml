[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omniline"
version = "0.1"
description = "User-friendly CLI and terminal UI for LINE Messenger, powered by OkLine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Greg Chao-Kuei Hung" }]
keywords = [
    "line", "line-messenger", "line-api", "line-bot", "line-messenger-api",
    "line-chrome", "line-chrome-extension-api", "line-client", "line-sdk",
    "python-line", "unofficial-line", "line-personal-account",
    "line-qr-login", "line-login-qr-code", "letter-sealing", "line-e2ee",
    "e2ee", "end-to-end-encryption", "line-notify-alternative",
    "linepy-alternative", "line-selfbot", "line-automation", "line-mcp",
    "chatbot", "automation", "messaging", "reverse-engineering",
    "chrome-extension", "thrift", "x-hmac", "okline",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Chinese (Traditional)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
    "cryptography>=41.0",
    "qrcode>=7.0",
    "prompt-toolkit>=3.0.52",
    "wcwidth>=0.9.4",
    "okline>=2.7.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "mypy>=1.8",
    "types-requests",
    "pre-commit>=3.5",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/ckhung/OmniLine"
Documentation = "https://github.com/ckhung/OmniLine/tree/main/docs"
Repository = "https://github.com/ckhung/OmniLine"
Issues = "https://github.com/ckhung/OmniLine/issues"
Changelog = "https://github.com/ckhung/OmniLine/blob/main/CHANGELOG.md"

[project.scripts]
omniline = "omniline.__main__:main"

[tool.setuptools.packages.find]
include = ["omniline*"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 95
target-version = "py39"


[tool.ruff.lint]
# pyflakes(F), pycodestyle(E/W), isort(I), pyupgrade(UP), bugbear(B),
# comprehensions(C4), pep8-naming(N), simplify(SIM), ruff(RUF)
select = ["F", "E", "W", "I", "UP", "B", "C4", "N", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter
    "B008",    # function calls in argument defaults (intentional, e.g. int(Enum))
    "SIM105",  # try/except/pass is clearer than contextlib.suppress here
    "SIM102",  # nested ifs are sometimes clearer than a combined condition
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode (Thai text in docs/strings)
    "N818",    # exception names: our public API is Line*Error, not *Exception
    # camelCase that deliberately mirrors LINE's wire field names / short aliases:
    "N815",    # e.g. sessionKey, reqSeq (match the Thrift struct fields)
    "N812", "N814", "N806",  # qrcode.constants as C, Message as _M, const-like locals
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "N802", "N806", "F841", "RUF012", "SIM115"]   # test ergonomics
"examples/*" = ["E402", "T201"]
"live_test.py" = ["E402", "T201"]
# the CLI is an argparse/dispatch builder where compact one-liners are intentional:


[tool.ruff.lint.isort]
known-first-party = ["okline", "omniline"]

[tool.mypy]
python_version = "3.10"
files = ["omniline"]
ignore_missing_imports = true        # requests/cryptography/qrcode stubs optional
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
